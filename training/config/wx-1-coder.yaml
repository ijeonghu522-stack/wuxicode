base_model: Qwen/Qwen2.5-Coder-7B-Instruct
method: qlora
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
lora:
  r: 64
  alpha: 128
  dropout: 0.05
training:
  output_dir: ./output/wx-1-coder-lora
  learning_rate: 1.0e-4
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  num_train_epochs: 5
  max_seq_length: 32768
dataset:
  train_file: datasets/wx_coder.jsonl
  max_samples: 300
