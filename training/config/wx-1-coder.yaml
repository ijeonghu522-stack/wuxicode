base_model: Qwen/Qwen2.5-Coder-1.5B-Instruct
method: qlora
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
lora:
  r: 64
  alpha: 128
  dropout: 0.05
training:
  output_dir: ./output/wx-1-coder-lora
  learning_rate: 1.0e-4
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  num_train_epochs: 3
  # 32768 은 T4(16GB) 에서 OOM. 코드 샘플은 4096 으로 충분.
  max_seq_length: 4096
  warmup_steps: 20
  lr_scheduler_type: cosine
  max_grad_norm: 0.3
  optim: paged_adamw_8bit
  save_steps: 100
  save_total_limit: 2
dataset:
  train_file: datasets/wx_coder.jsonl
  max_samples: 5000